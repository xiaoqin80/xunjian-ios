<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>寻见 · 收藏册</title>
<link rel="icon" href="favicon.svg">
<style>
:root{
  --paper:#F7F2E8; --paper2:#FCF9F2; --ink:#26231E; --ink2:#5D574C; --ink3:#93897A;
  --line:#E4DBC9; --brass:#8A6A3B; --brass2:#B5924F;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,SimSun,serif;
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--paper);font-family:var(--sans)}
.phone{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.status{height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;font-size:11px;color:var(--ink3)}
.top{flex:0 0 auto;padding:6px 20px 8px;display:flex;align-items:center;gap:10px}
.top .back{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--brass);
  font-size:19px;cursor:pointer}
.top h1{font-family:var(--serif);font-size:20px;letter-spacing:5px;font-weight:600}
.top .cnt{margin-left:auto;font-size:10.5px;color:var(--ink3);letter-spacing:.8px}
.tabs{flex:0 0 auto;display:flex;gap:8px;padding:0 20px 10px}
.tabs button{font-family:var(--sans);font-size:11.5px;letter-spacing:.6px;color:var(--ink2);
  background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.tabs button.on{color:#fff;background:var(--brass);border-color:var(--brass)}
.body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 18px 24px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.slot{position:relative;aspect-ratio:3/4;border-radius:9px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:6px 4px;text-align:center;overflow:hidden}
.slot.off{border:1px dashed var(--line);background:rgba(255,255,255,.35);color:var(--ink3)}
.slot.off .q{font-size:15px;opacity:.42;line-height:1}
.slot.off .t{font-size:7.5px;margin-top:4px;line-height:1.4;opacity:.7}
.slot.on{border:1px solid var(--line);background:linear-gradient(160deg,#FCF9F2,#F7F2E8);
  box-shadow:0 2px 6px rgba(38,35,30,.07);cursor:pointer}
.slot.on .n{font-family:var(--serif);font-size:11.5px;letter-spacing:.4px;color:var(--ink);line-height:1.35}
.slot.on .b{font-size:7.5px;color:var(--ink3);margin-top:3px}
.slot.k{background:linear-gradient(160deg,#2A2419,#1B1712);border-color:#8A6A3B}
.slot.k .n{color:#F7F2E8;font-size:10px}
.slot.k .b{color:#B5924F}
.sec{margin:14px 2px 8px;font-size:11px;letter-spacing:2px;color:var(--ink3)}
.ov{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;
  background:rgba(16,14,12,.965);backdrop-filter:blur(4px);font-family:var(--serif);color:#F7F2E8;padding:24px}
.ov .box{max-width:300px;text-align:center;padding:36px 30px;border:1px solid rgba(181,146,79,.5);
  border-radius:14px;background:linear-gradient(160deg,rgba(60,48,32,.6),rgba(26,23,20,.95))}
.ov .k{font-size:11px;letter-spacing:5px;color:#B5924F;margin-bottom:16px}
.ov .b2{font-size:12px;letter-spacing:2px;color:rgba(247,242,232,.6);margin-bottom:8px}
.ov .n{font-size:28px;letter-spacing:5px;line-height:1.45}
.ov .r{margin-top:13px;font-size:11.5px;color:#B5924F;letter-spacing:1px}
.ov .l{margin-top:12px;font-size:12px;line-height:1.95;color:rgba(247,242,232,.78)}
.ov .h{margin-top:22px;font-size:10.5px;letter-spacing:2px;color:rgba(247,242,232,.45)}
</style></head>
<body><div class="phone">
  <div class="status"><span>9:41</span><span>—</span></div>
  <div class="top">
    <div class="back" id="back">‹</div>
    <h1>收藏册</h1>
    <div class="cnt" id="cnt">0 / 79</div>
  </div>
  <div class="tabs" id="tabs">
    <button data-t="all" class="on">全部</button>
    <button data-t="person">人物 66</button>
    <button data-t="milestone">里程碑 12</button>
    <button data-t="king">君王 1</button>
  </div>
  <div class="body" id="body"></div>
</div>

<script src="js/fx.js"></script>
<script src="js/unlock.js"></script>
<script>
(function(){
  const J = window.XJ, body = document.getElementById('body'), cnt = document.getElementById('cnt');
  let cards = [], tab = 'all';

  function slot(c, owned){
    if(!owned){
      const t = c.type === 'person' ? (c.book || '') : (c.seg || '');
      return `<div class="slot off"><div class="q">?</div><div class="t">${t}</div></div>`;
    }
    if(c.type === 'king')
      return `<div class="slot on k" data-id="${c.id}"><div class="n">万王之王</div><div class="b">耶稣基督</div></div>`;
    const n = c.name.length > 5 ? c.name.slice(0, 5) : c.name;
    const b = c.type === 'person' ? (c.book || '') : '里程碑';
    return `<div class="slot on" data-id="${c.id}"><div class="n">${n}</div><div class="b">${b}</div></div>`;
  }

  function render(){
    const owned = new Set((J.p.rewards) || []);
    cnt.textContent = owned.size + ' / ' + cards.length;
    const groups = [
      { t:'person',    title:'卷人物卡 · 66',  list: cards.filter(c => c.type === 'person') },
      { t:'milestone', title:'阶段里程碑 · 12', list: cards.filter(c => c.type === 'milestone') },
      { t:'king',      title:'君王卡 · 1',      list: cards.filter(c => c.type === 'king') }
    ];
    let html = '';
    groups.forEach(g => {
      if(tab !== 'all' && tab !== g.t) return;
      html += `<div class="sec">${g.title}</div><div class="grid">`
        + g.list.map(c => slot(c, owned.has(c.id))).join('') + '</div>';
    });
    body.innerHTML = html;
    body.querySelectorAll('.slot.on[data-id]').forEach(el => {
      el.onclick = () => {
        const c = cards.find(x => x.id === el.dataset.id);
        if(c) show(c);
      };
    });
  }

  function show(c){
    const d = document.createElement('div');
    d.className = 'ov';
    const label = c.type === 'king' ? '终局奖励' : (c.type === 'milestone' ? '阶段里程碑' : '本卷人物');
    d.innerHTML = `<div class="box"><div class="k">${label}</div>
      <div class="b2">${c.book || c.seg || ''}</div>
      <div class="n">${c.name}</div>
      <div class="r">${c.ref || c.scope || ''}</div>
      <div class="l">${c.line || ''}</div>
      <div class="h">轻点任意处收起</div></div>`;
    document.body.appendChild(d);
    if(window.XJfx) XJfx.chime('chapter');
    d.onclick = () => d.remove();
  }

  document.getElementById('tabs').querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      tab = b.dataset.t;
      document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
      render();
      body.scrollTop = 0;
    };
  });
  document.getElementById('back').onclick = () => { location.href = '我的.html'; };

  J.init().then(() => {
    return fetch('data/figures.json').then(r => r.json()).then(o => {
      cards = (o.cards || []).sort((a,b) => ({person:0,milestone:1,king:2}[a.type] - {person:0,milestone:1,king:2}[b.type]) || (a.no - b.no));
      render();
    });
  }).catch(()=>{ body.innerHTML = '<div class="sec">数据载入失败</div>'; });
})();
</script>
</body></html>
