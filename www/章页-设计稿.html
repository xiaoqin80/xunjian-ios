<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>章页 · 寻见</title>
<style>
:root{--paper:#F7F2E8;--paper2:#FCF9F2;--ink:#26231E;--ink2:#5D574C;--ink3:#93897A;
--line:#E4DBC9;--brass:#8A6A3B;--brass2:#B5924F;
--serif:"Noto Serif SC","Songti SC",STSong,SimSun,serif;--sans:"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--paper);font-family:var(--sans);display:flex;justify-content:center}
.phone{width:100%;max-width:430px;height:100dvh;background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
.status{height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:11px;color:var(--ink3)}
.top{flex:0 0 auto;padding:2px 18px 9px;border-bottom:1px solid var(--line)}
.trow{display:flex;align-items:center;gap:9px}
.back{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--brass);font-size:19px;cursor:pointer}
.tt{flex:1;min-width:0}
.tt h1{font-family:var(--serif);font-size:16.5px;letter-spacing:2px;font-weight:600}
.tt p{font-size:9.5px;color:var(--ink3);letter-spacing:1.1px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vno{font-size:8.5px;color:var(--brass);border:1px solid var(--line);border-radius:999px;padding:2px 7px;letter-spacing:.5px;white-space:nowrap}
/* 章脉轨：与节卡背面同一视觉语言，可点可拖 */
.track{margin:9px 0 0;cursor:pointer;touch-action:none}
.bar{position:relative;height:5px;border-radius:3px;background:#E7DFCE}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:rgba(138,106,59,.28)}
.bar b{position:absolute;top:-3.5px;width:2px;height:12px;background:var(--brass);border-radius:1px;transform:translateX(-1px);box-shadow:0 0 0 1.5px rgba(138,106,59,.14)}
.tl{display:flex;justify-content:space-between;font-size:8.5px;color:var(--ink3);letter-spacing:.5px;margin-top:5px}
.tl .cur{color:var(--brass);letter-spacing:1px}
.body{flex:1 1 auto;overflow-y:auto;padding:8px 18px 30px;scroll-behavior:smooth}
.vp{display:flex;gap:10px;padding:8px 9px;border-radius:10px;margin:1px 0;cursor:pointer;transition:background .16s}
.vp:hover{background:#F1E9D9}
.vp .n{flex:0 0 21px;font-size:9.5px;color:var(--ink3);padding-top:5px;font-variant-numeric:tabular-nums;text-align:right}
.vp .t{flex:1;font-family:var(--serif);font-size:15px;line-height:2.02;color:var(--ink)}
.vp.hit{background:rgba(181,146,79,.13);box-shadow:inset 3px 0 0 var(--brass),inset 0 0 0 1px rgba(181,146,79,.28)}
.vp.hit .n{color:var(--brass);font-weight:600}
.vp.hit .t{font-size:16px}
.vp{position:relative}
.vp .badge{display:none}
.vp.hit .badge{display:block;position:absolute;right:8px;top:7px;font-size:8px;color:var(--brass);
  border:1px solid var(--line);border-radius:999px;padding:1px 6px;letter-spacing:.5px;background:var(--paper2)}
.kw{font-style:normal;color:var(--brass);font-weight:600;background:rgba(181,146,79,.18);border-radius:3px;padding:0 1px}
.foot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 18px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  background:rgba(252,249,242,.96);font-size:10.5px;color:var(--ink3)}
.foot button{border:1px solid var(--line);background:var(--paper2);color:var(--ink2);border-radius:9px;
  padding:6px 12px;font-size:11px;cursor:pointer}
.foot .mid{letter-spacing:1px;font-variant-numeric:tabular-nums}
.loading{text-align:center;color:var(--ink3);font-size:12px;padding:40px 0}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span style="width:14px;height:7px;border:1px solid var(--ink3);border-radius:2px;opacity:.7"></span></div>

  <div class="top">
    <div class="trow">
      <div class="back" id="back">‹</div>
      <div class="tt"><h1 id="bn">—</h1><p id="sub">—</p></div>
      <span class="vno" id="vno">节卡</span>
    </div>
    <div class="track" id="track">
      <div class="bar"><i id="fill"></i><b id="mark"></b></div>
      <div class="tl"><span>1</span><span class="cur" id="curlab">—</span><span id="endlab">—</span></div>
    </div>
  </div>

  <div class="body" id="body"><div class="loading">载入中…</div></div>

  <div class="foot">
    <button id="prev">‹ 上一章</button>
    <span class="mid" id="mid">—</span>
    <button id="next">下一章 ›</button>
  </div>
</div>

<script>
const BOOK = ["创世记","出埃及记","利未记","民数记","申命记","约书亚记","士师记","路得记","撒母耳记上","撒母耳记下",
"列王纪上","列王纪下","历代志上","历代志下","以斯拉记","尼希米记","以斯帖记","约伯记","诗篇","箴言",
"传道书","雅歌","以赛亚书","耶利米书","耶利米哀歌","以西结书","但以理书","何西阿书","约珥书","阿摩司书",
"俄巴底亚书","约拿书","弥迦书","那鸿书","哈巴谷书","西番雅书","哈该书","撒迦利亚书","玛拉基书",
"马太福音","马可福音","路加福音","约翰福音","使徒行传","罗马书","哥林多前书","哥林多后书","加拉太书","以弗所书",
"腓立比书","歌罗西书","帖撒罗尼迦前书","帖撒罗尼迦后书","提摩太前书","提摩太后书","提多书","腓利门书",
"希伯来书","雅各书","彼得前书","彼得后书","约翰一书","约翰二书","约翰三书","犹大书","启示录"];

const q = new URLSearchParams(location.search);
let b = Math.max(1, Math.min(66, parseInt(q.get('b') || '43', 10)));   // 1-based 书序号
let c = parseInt(q.get('c') || '3', 10);
let targetV = parseInt(q.get('v') || '16', 10);
const vno = q.get('vno') || '';          // 节卡编号（来自节卡详情）
const kw  = q.get('kw') || '';
const from = q.get('from') || '';

let cache = {}, maxChapter = 1, lines = [];

async function loadBook(bi){
  if(cache[bi]) return cache[bi];
  const r = await fetch('data/b' + String(bi).padStart(2,'0') + '.json');
  const rows = await r.json();
  cache[bi] = rows;
  return rows;
}
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hl(s){ let x = esc(s); return kw ? x.split(kw).join('<em class="kw">'+kw+'</em>') : x; }

function paintTrack(){
  const n = lines.length || 1;
  const pct = Math.min(100, Math.max(0, (targetV / n) * 100));
  document.getElementById('fill').style.width = pct + '%';
  document.getElementById('mark').style.left = pct + '%';
  document.getElementById('curlab').textContent = c + ':' + targetV;
  document.getElementById('endlab').textContent = '共 ' + n + ' 节';
}

function paintHit(){
  document.querySelectorAll('.vp').forEach(function(el){
    el.classList.toggle('hit', +el.dataset.v === targetV);
  });
  const hit = document.querySelector('.vp.hit');
  if(hit) hit.scrollIntoView({block:'center', behavior:'smooth'});
  paintTrack();
}

async function render(){
  const rows = await loadBook(b);
  maxChapter = Math.max.apply(null, rows.map(function(r){ return r[0]; }));
  if(c > maxChapter) c = maxChapter;
  lines = rows.filter(function(r){ return r[0] === c; });
  if(!lines.length){ document.getElementById('body').innerHTML = '<div class="loading">本章无内容</div>'; return; }
  if(targetV > lines.length) targetV = lines.length;

  document.getElementById('bn').textContent = BOOK[b-1];
  document.getElementById('sub').textContent = '第 ' + c + ' 章 · 第 ' + targetV + ' 节' +
    (from ? ' · 起于「' + from + '」' : '');
  document.getElementById('vno').textContent = vno ? ('节卡 №' + vno) : ('本章 ' + lines.length + ' 节');
  document.getElementById('mid').textContent = BOOK[b-1] + ' ' + c + ' / 共 ' + maxChapter + ' 章';

  const body = document.getElementById('body');
  body.innerHTML = lines.map(function(r){
    return '<div class="vp' + (r[1] === targetV ? ' hit' : '') + '" data-v="' + r[1] + '">' +
      '<span class="n">' + r[1] + '</span>' +
      '<span class="t">' + hl(r[2]) + '</span>' +
      (r[1] === targetV ? '<span class="badge">本节</span>' : '') + '</div>';
  }).join('');

  body.querySelectorAll('.vp').forEach(function(el){
    el.onclick = function(){ setVerse(+el.dataset.v); };
  });
  paintTrack();
  const hit = body.querySelector('.vp.hit'); if(hit) hit.scrollIntoView({block:'center'});
}

function setVerse(v){
  targetV = Math.min(Math.max(1, v), lines.length);
  history.replaceState(null, '', location.pathname + '?b=' + b + '&c=' + c + '&v=' + targetV +
    (vno ? '&vno=' + vno : '') + (kw ? '&kw=' + encodeURIComponent(kw) : '') + (from ? '&from=' + encodeURIComponent(from) : ''));
  document.getElementById('sub').textContent = '第 ' + c + ' 章 · 第 ' + targetV + ' 节' +
    (from ? ' · 起于「' + from + '」' : '');
  paintHit();
}

/* 章脉轨：点哪跳哪 */
const track = document.getElementById('track');
function jumpFromX(clientX){
  const r = track.querySelector('.bar').getBoundingClientRect();
  const p = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
  setVerse(Math.max(1, Math.round(p * lines.length)));
}
track.addEventListener('pointerdown', function(e){ track._dragging = true; jumpFromX(e.clientX); });
track.addEventListener('pointermove', function(e){ if(track._dragging) jumpFromX(e.clientX); });
['pointerup','pointercancel','pointerleave'].forEach(function(ev){
  track.addEventListener(ev, function(){ track._dragging = false; });
});

document.getElementById('back').onclick = function(){
  if(vno) location.href = '经库.html?card=verse&vno=' + vno;
  else location.href = '阅读页.html?b=' + b + '&c=' + c + '&v=' + targetV;
};
document.getElementById('prev').onclick = function(){
  if(c > 1){ c--; targetV = 1; location.search = '?b=' + b + '&c=' + c + '&v=1'; }
  else if(b > 1){ b--; loadBook(b).then(function(rows){ c = Math.max.apply(null, rows.map(function(r){return r[0];})); targetV = 1; location.search = '?b=' + b + '&c=' + c + '&v=1'; }); }
};
document.getElementById('next').onclick = function(){
  if(c < maxChapter){ c++; targetV = 1; location.search = '?b=' + b + '&c=' + c + '&v=1'; }
  else if(b < 66){ b++; c = 1; targetV = 1; location.search = '?b=' + b + '&c=1&v=1'; }
};

render();
</script>
</body>
</html>
