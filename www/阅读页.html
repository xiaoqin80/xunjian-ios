<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>阅读页 · 寻见</title>
<style>
:root{--paper:#F7F2E8;--paper2:#FCF9F2;--ink:#26231E;--ink2:#5D574C;--ink3:#93897A;
--line:#E4DBC9;--brass:#8A6A3B;--brass2:#B5924F;
--serif:"Noto Serif SC","Songti SC",STSong,SimSun,serif;--sans:"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--paper);font-family:var(--sans);display:flex;justify-content:center}
.phone{width:100%;max-width:430px;height:100dvh;background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
.status{height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:11px;color:var(--ink3)}
.top{flex:0 0 auto;padding:2px 18px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.back{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--brass);font-size:19px;cursor:pointer}
.tt{flex:1}
.tt h1{font-family:var(--serif);font-size:16px;letter-spacing:2px;font-weight:600}
.tt p{font-size:9.5px;color:var(--ink3);letter-spacing:1.2px;margin-top:2px}
.chap{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--ink3)}
.chap button{border:1px solid var(--line);background:var(--paper2);color:var(--ink2);border-radius:8px;
  font-size:11px;padding:4px 9px;cursor:pointer}
.body{flex:1 1 auto;overflow-y:auto;padding:6px 20px 40px;scroll-behavior:smooth}
.vp{display:flex;gap:9px;padding:7px 8px;border-radius:9px;margin:2px 0;cursor:pointer}
.vp:hover{background:#F1E9D9}
.vp .n{flex:0 0 20px;font-size:9.5px;color:var(--ink3);padding-top:4px;font-variant-numeric:tabular-nums;text-align:right}
.vp .t{flex:1;font-family:var(--serif);font-size:15px;line-height:2.05;color:var(--ink)}
.vp.hit{background:rgba(181,146,79,.13);box-shadow:inset 0 0 0 1px rgba(181,146,79,.35)}
.vp.hit .t{color:var(--ink)}
.vp.hit .n{color:var(--brass);font-weight:600}
.kw{font-style:normal;color:var(--brass);font-weight:600;background:rgba(181,146,79,.18);border-radius:3px;padding:0 1px}
.foot{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 18px;
  border-top:1px solid var(--line);background:rgba(252,249,242,.96);font-size:11px;color:var(--ink3)}
.foot button{border:1px solid var(--line);background:var(--paper2);color:var(--ink2);border-radius:9px;padding:6px 14px;font-size:11.5px;cursor:pointer}
.foot span{letter-spacing:1px}
.loading{text-align:center;color:var(--ink3);font-size:12px;padding:40px 0}

.tabbar{flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:rgba(252,249,242,.96);
  padding:9px 6px calc(9px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink3);
  position:relative;padding-top:5px;cursor:pointer}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10.5px;letter-spacing:1.4px}
.tab.on{color:var(--brass)}
.tab.on span{font-weight:600}
.tab.on:before{content:"";position:absolute;top:-6px;width:20px;height:2px;border-radius:2px;background:var(--brass)}
</style>
<style id="tablet-css">
/* ── 平板适配（宽度 ≥700px 生效） ── */
@media (min-width: 560px){
  .phone{max-width:none!important;width:100%!important;height:100dvh!important;
         border-radius:0!important;box-shadow:none!important}
  .status{display:none!important}
  .tabbar{padding:14px 12px calc(14px + env(safe-area-inset-bottom))}
  .tab svg{width:24px;height:24px}
  .tab span{font-size:12px;letter-spacing:2px}
}
@media (min-width: 560px) and (max-width: 999px){
  .phone{border-radius:0!important}
}

@media (min-width: 560px){ .body,.wrap{max-width:820px;margin:0 auto} }

/* JS 兜底：媒体查询在部分 WebView 不生效时，用 class 兜住平板宽度 */
html.tab-wide .phone{max-width:none!important;width:100%!important;height:100vh!important;height:100dvh!important}
html.tab-wide .status{display:none!important}
</style>
<style id="hard-css">
/* 全局防压缩：文字永不逐字换行（部分 WebView 会把容器算窄） */
html,body{-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important}
.tab span,.chip,.tagline .tw,.swipe span{white-space:nowrap!important}
</style>
<style id="prefs-css">
/* 夜间 */
html[data-theme="night"]{--paper:#141210;--paper2:#1C1915;--ink:#EDE6D8;--ink2:#B8AE9D;--ink3:#8B8172;
  --line:#2E2A23;--brass:#C9A063;--brass2:#E2C089;--brass-soft:rgba(201,160,99,.14)}
html[data-theme="night"] body{background:#0B0908!important}
/* 正文字号倍数 */
html[data-fs="s"]{--fsx:.92} html[data-fs="m"]{--fsx:1}
html[data-fs="l"]{--fsx:1.1} html[data-fs="xl"]{--fsx:1.2}
html[data-fs="s"] .zv,html[data-fs="l"] .zv,html[data-fs="xl"] .zv{letter-spacing:.4px}
html[data-fs="s"] .zvref,html[data-fs="l"] .zvref,html[data-fs="xl"] .zvref{font-size:calc(12.5px*var(--fsx))!important}
html[data-fs="s"] .zvsub,html[data-fs="l"] .zvsub,html[data-fs="xl"] .zvsub{font-size:calc(9px*var(--fsx))!important}
html[data-fs="s"] .zfirst,html[data-fs="l"] .zfirst,html[data-fs="xl"] .zfirst{font-size:calc(10px*var(--fsx))!important}
html[data-fs="s"] .vs .q,html[data-fs="l"] .vs .q,html[data-fs="xl"] .vs .q{font-size:calc(14px*var(--fsx))!important}
html[data-fs="s"] .bvs .q,html[data-fs="l"] .bvs .q,html[data-fs="xl"] .bvs .q{font-size:calc(13.6px*var(--fsx))!important}
html[data-fs="s"] .chkv .t,html[data-fs="l"] .chkv .t,html[data-fs="xl"] .chkv .t{font-size:calc(10.8px*var(--fsx))!important}
html[data-fs="s"] .def,html[data-fs="l"] .def,html[data-fs="xl"] .def{font-size:calc(11.5px*var(--fsx))!important}
html[data-fs="s"] .ref,html[data-fs="l"] .ref,html[data-fs="xl"] .ref{font-size:calc(11.5px*var(--fsx))!important}
</style>
<style id="prefs-css-2">
html[data-fs="s"] .t,html[data-fs="l"] .t,html[data-fs="xl"] .t{font-size:calc(15px * var(--fsx))!important}
html[data-fs="s"] .q,html[data-fs="l"] .q,html[data-fs="xl"] .q{font-size:calc(14px * var(--fsx))!important}
</style>
</head>
<script id="xj-prefs-early">
(function(){try{var p=JSON.parse(localStorage.getItem('xj_prefs')||'{}');
if(p.theme)document.documentElement.dataset.theme=p.theme;
if(p.fs)document.documentElement.dataset.fs=p.fs;}catch(e){}})();
</script>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span style="width:14px;height:7px;border:1px solid var(--ink3);border-radius:2px;opacity:.7"></span></div>
  <div class="top">
    <div class="back" id="back">‹</div>
    <div class="tt"><h1 id="bn">—</h1><p id="sub">—</p></div>
    <div class="chap"><button id="prev">上一章</button><button id="next">下一章</button></div>
  </div>
  <div class="body" id="body"><div class="loading">载入中…</div></div>
  <div class="foot"><span id="fc">—</span></div>

  <div class="tabbar" id="tabbar">
    <div class="tab" data-href="index.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="m15.1 8.9-1.8 4.4-4.4 1.8 1.8-4.4z"/></svg><span>寻见</span></div>
    <div class="tab on" data-href="经库.html"><svg viewBox="0 0 24 24"><path d="M11.2 6.2C9.6 5 7.4 4.4 4.5 4.4v13.2c2.9 0 5.1.6 6.7 1.8 1.6-1.2 3.8-1.8 6.7-1.8V4.4c-2.9 0-5.1.6-6.7 1.8z"/><path d="M11.2 6.2v13.2"/></svg><span>迦南</span></div>
    <div class="tab" data-href="乐库.html"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg><span>敬拜</span></div>
    <div class="tab" data-href="我的.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c1.2-3.8 3.6-5.4 7-5.4S17.8 16.2 19 20"/></svg><span>圣殿</span></div>
  </div>
</div>

<script>
const BOOK = ["创世记","出埃及记","利未记","民数记","申命记","约书亚记","士师记","路得记","撒母耳记上","撒母耳记下",
"列王纪上","列王纪下","历代志上","历代志下","以斯拉记","尼希米记","以斯帖记","约伯记","诗篇","箴言",
"传道书","雅歌","以赛亚书","耶利米书","耶利米哀歌","以西结书","但以理书","何西阿书","约珥书","阿摩司书",
"俄巴底亚书","约拿书","弥迦书","那鸿书","哈巴谷书","西番雅书","哈该书","撒迦利亚书","玛拉基书",
"马太福音","马可福音","路加福音","约翰福音","使徒行传","罗马书","哥林多前书","哥林多后书","加拉太书","以弗所书",
"腓立比书","歌罗西书","帖撒罗尼迦前书","帖撒罗尼迦后书","提摩太前书","提摩太后书","提多书","腓利门书",
"希伯来书","雅各书","彼得前书","彼得后书","约翰一书","约翰二书","约翰三书","犹大书","启示录"];

const q = new URLSearchParams(location.search);
let b = Math.max(1, Math.min(66, parseInt(q.get('b') || '19', 10)));   // 默认诗篇
let c = parseInt(q.get('c') || '1', 10);
const targetV = parseInt(q.get('v') || '0', 10);
const kw = q.get('kw') || '';
const from = q.get('from') || '';

let cache = {}, maxChapter = 1;

async function loadBook(bi){
  if(cache[bi]) return cache[bi];
  const r = await fetch('data/b' + String(bi).padStart(2,'0') + '.json');
  const rows = await r.json();
  cache[bi] = rows;
  return rows;
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hl(s){
  let x = esc(s);
  if(kw) x = x.split(kw).join('<em class="kw">' + kw + '</em>');
  return x;
}

async function render(){
  const rows = await loadBook(b);
  maxChapter = Math.max.apply(null, rows.map(function(r){ return r[0]; }));
  if(c > maxChapter) c = maxChapter;
  document.getElementById('bn').textContent = BOOK[b-1];
  document.getElementById('sub').textContent = '第 ' + c + ' 章' + (targetV ? ' · 第 ' + targetV + ' 节' : '') +
    (from ? ' · 起于「' + from + '」' : '');
  document.getElementById('fc').textContent = BOOK[b-1] + ' ' + c + ' / 共 ' + maxChapter + ' 章';
  const lines = rows.filter(function(r){ return r[0] === c; });
  const body = document.getElementById('body');
  body.innerHTML = lines.map(function(r){
    const hit = (r[1] === targetV) ? ' hit' : '';
    return '<div class="vp' + hit + '" data-v="' + r[1] + '"><span class="n">' + r[1] + '</span>' +
           '<span class="t">' + hl(r[2]) + '</span></div>';
  }).join('') || '<div class="loading">本章无内容</div>';

  const hitEl = body.querySelector('.vp.hit');
  if(hitEl){ hitEl.scrollIntoView({block:'center'}); }

  body.querySelectorAll('.vp').forEach(function(el){
    el.onclick = function(){
      body.querySelectorAll('.vp.hit').forEach(function(x){ x.classList.remove('hit'); });
      el.classList.add('hit');
      const v = el.dataset.v;
      history.replaceState(null, '', location.pathname + '?b=' + b + '&c=' + c + '&v=' + v +
        (kw ? '&kw=' + encodeURIComponent(kw) : '') + (from ? '&from=' + encodeURIComponent(from) : ''));
    };
  });
}

document.getElementById('prev').onclick = function(){
  if(c > 1){ c--; location.search = '?b=' + b + '&c=' + c + (kw?'&kw='+encodeURIComponent(kw):'') + (from?'&from='+encodeURIComponent(from):''); }
  else if(b > 1){ b--; c = 1; location.search = '?b=' + b + '&c=' + c; }
};
document.getElementById('next').onclick = function(){
  if(c < maxChapter){ c++; location.search = '?b=' + b + '&c=' + c + (kw?'&kw='+encodeURIComponent(kw):'') + (from?'&from='+encodeURIComponent(from):''); }
  else if(b < 66){ b++; c = 1; location.search = '?b=' + b + '&c=' + c; }
};
document.getElementById('back').onclick = function(){
  if(from){ location.href = '经页.html?kw=' + encodeURIComponent(from); }
  else history.back();
};

document.querySelectorAll('#tabbar .tab').forEach(function(t){
  t.onclick = function(){ if(t.classList.contains('on')) return; location.href = t.dataset.href; };
});

render();
</script>
<style>html.embed .tabbar{display:none!important}html.embed .status{display:none!important}</style><script>if(window.name==="xj-embed"||/[?&]embed=1/.test(location.search))document.documentElement.classList.add("embed");</script>
<script id="tab-class">(function(){function set(){var w=window.innerWidth,h=window.innerHeight;var r=document.documentElement;r.classList.toggle("tab-wide",w>=560);r.classList.toggle("tab-tall",w>=560&&h>=900);}set();window.addEventListener("resize",set);window.addEventListener("orientationchange",function(){setTimeout(set,120);});})();</script>
</body>
</html>
