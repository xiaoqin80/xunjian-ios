<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>寻见 · 复习</title>
<link rel="icon" href="favicon.svg">
<style>
:root{
  --paper:#F7F2E8; --paper2:#FCF9F2; --ink:#26231E; --ink2:#5D574C; --ink3:#93897A;
  --line:#E4DBC9; --brass:#8A6A3B; --brass2:#B5924F;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,SimSun,serif;
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--paper);font-family:var(--sans)}
.phone{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.status{height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;font-size:11px;color:var(--ink3)}
.top{flex:0 0 auto;padding:6px 20px 10px;display:flex;align-items:center;gap:10px}
.top .back{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--brass);
  font-size:19px;cursor:pointer}
.top h1{font-family:var(--serif);font-size:20px;letter-spacing:5px;font-weight:600}
.top .cnt{margin-left:auto;font-size:10.5px;color:var(--ink3);letter-spacing:.8px}
.body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:0 22px 20px}
.card{width:100%;max-width:322px;aspect-ratio:322/366;border-radius:18px;background:var(--paper2);
  border:1px solid var(--line);box-shadow:0 10px 30px rgba(38,35,30,.08);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
.card .k{font-size:9.5px;letter-spacing:2px;color:var(--ink3)}
.card .n{font-family:var(--serif);font-size:40px;letter-spacing:3px;color:var(--ink)}
.card .n.big2{font-size:34px;letter-spacing:2px}
.card .t{font-size:10.5px;color:var(--ink3);letter-spacing:.6px;text-align:center}
.card .lk{font-size:11.5px;color:var(--brass);letter-spacing:1px;text-decoration:none;border-bottom:1px solid var(--brass);padding-bottom:2px}
.ok{margin-top:22px;padding:11px 40px;border:none;border-radius:999px;background:var(--brass);color:#FBF8F1;
  font-family:var(--sans);font-size:13px;letter-spacing:2px;box-shadow:0 6px 16px rgba(138,106,59,.28)}
.ok:active{transform:scale(.97)}
.hint{margin-top:14px;font-size:10.5px;color:var(--ink3);letter-spacing:.6px;text-align:center;line-height:1.8}
.done{text-align:center}
.done .big{font-family:var(--serif);font-size:26px;letter-spacing:4px;color:var(--brass);margin-bottom:10px}
.done .s{font-size:11.5px;color:var(--ink2);line-height:2}
.bar{width:100%;max-width:322px;height:2px;background:var(--line);border-radius:2px;margin-top:18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);width:0;transition:width .3s}
.xjToast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(38,35,30,.92);
  color:#FBF8F1;font-size:12.5px;padding:9px 16px;border-radius:999px;opacity:0;transition:opacity .25s;z-index:99}
</style></head>
<body><div class="phone">
  <div class="status"><span>9:41</span><span>—</span></div>
  <div class="top">
    <div class="back" id="back">‹</div>
    <h1>复习</h1>
    <div class="cnt" id="cnt">—</div>
  </div>
  <div class="body" id="body"></div>
</div>
<div class="xjToast" id="toast"></div>

<script src="js/fx.js"></script>
<script src="js/unlock.js"></script>
<script>
(function(){
  const J = window.XJ, body = document.getElementById('body'), cnt = document.getElementById('cnt');
  let queue = [], i = 0, doneCount = 0, bonus = false;

  function toast(t){
    const el = document.getElementById('toast');
    el.textContent = t; el.style.opacity = '1';
    clearTimeout(el._h); el._h = setTimeout(()=> el.style.opacity = '0', 1800);
  }
  const NAME = { z:'字卡', w:'词卡', v:'节卡', cp:'章卡' };

  function linkFor(item){
    if(item.kind === 'w')  return '经库.html?card=word&wno=' + item.no;
    if(item.kind === 'v')  return '经库.html?card=verse&vno=' + item.no;
    if(item.kind === 'cp') return '经库.html?card=chap&cno=' + item.no;
    return '经库.html?no=' + item.no;
  }

  function render(){
    const st = J.reviewStat();
    cnt.textContent = '今日已复习 ' + st.doneToday + ' 张 · 队列 ' + queue.length;

    if(i >= queue.length){
      const nd = (J.nextDue ? J.nextDue() : 0);
      let when = '暂无排期';
      if(nd){
        const days = Math.ceil((nd - Date.now()) / 86400000);
        const d = new Date(nd);
        when = (days <= 1 ? '明天' : days + ' 天后') + '（' + (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日）';
      }
      body.innerHTML = `<div class="done">
        <div class="big">今日复习完成</div>
        <div class="s">已复习 ${doneCount} 张${bonus ? ' · 获得 1 次抽卡机会' : ''}<br>
          下一批：<b style="color:var(--brass)">${when}</b></div>
        <button class="ok" id="goHome" style="margin-top:22px">回首页</button>
        <div class="hint" id="autoTip" style="margin-top:10px">2 秒后自动回首页…</div>
      </div>`;
      if(window.XJfx) XJfx.chime('chapter');

      const back = () => {
        if(window.parent !== window) parent.postMessage({ __xj: 'home' }, '*');
        else location.href = 'index.html';
      };
      const btn = document.getElementById('goHome');
      if(btn) btn.onclick = back;
      setTimeout(back, 2000);
      return;
    }

    const it = queue[i];
    const label = it.label || '';
    body.innerHTML = `
      <div class="card">
        <div class="k">${NAME[it.kind] || '卡片'}${label ? '' : ' · ' + (it.kind === 'z' ? String(it.no).padStart(4,'0') : it.no)}</div>
        <div class="n${label ? ' big2' : ''}">${label || (it.kind === 'z' ? String(it.no).padStart(4,'0') : it.no)}</div>
        <a class="lk" href="${linkFor(it)}">打开这张卡 ›</a>
        <div class="t">回忆一下它的内容，再点下面的按钮</div>
      </div>
      <button class="ok" id="ok">记住了</button>
      <div class="bar"><i id="pg"></i></div>
      <div class="hint">第 ${i+1} / ${queue.length} 张 · 间隔 ${[1,3,7,21][Math.min(it.reps,3)]} 天后再次出现</div>`;
    document.getElementById('pg').style.width = ((i) / queue.length * 100) + '%';
    document.getElementById('ok').onclick = () => {
      const r = J.reviewDone(it.kind, it.no);
      doneCount++; i++;
      if(r && r.bonus) bonus = true;
      if(window.XJfx){ XJfx.chime('unlock'); XJfx.burst(document.querySelector('.card'), 'unlock'); }
      render();
    };
  }

  J.init().then(()=>{
    queue = J.dueList();
    if(!queue.length){
      const nd = (J.nextDue ? J.nextDue() : 0);
      let when = '还没有学过的卡';
      if(nd){
        const days = Math.ceil((nd - Date.now()) / 86400000);
        const d = new Date(nd);
        when = (days <= 1 ? '明天' : days + ' 天后') + '（' + (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日）';
      }
      body.innerHTML = `<div class="done">
        <div class="big">今天没有到期的卡</div>
        <div class="s">学完的卡会按 1 / 3 / 7 / 21 天的间隔回来<br>
          下一批：<b style="color:var(--brass)">${when}</b></div>
        <button class="ok" id="goHome" style="margin-top:22px">回首页</button>
      </div>`;
      const btn0 = document.getElementById('goHome');
      if(btn0) btn0.onclick = () => {
        if(window.parent !== window) parent.postMessage({ __xj: 'home' }, '*');
        else location.href = 'index.html';
      };
      cnt.textContent = '队列 0 张';
      return;
    }
    render();
  }).catch(()=>{ body.innerHTML = '<div class="done"><div class="s">数据载入失败</div></div>'; });

  document.getElementById('back').onclick = () => { location.href = 'shell.html'; };
})();
</script>
</body></html>
