<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>寻见 · 迦南 v0.2（含字卡）</title>
<style>
:root{
  --paper:#F7F2E8; --paper2:#FCF9F2; --ink:#26231E; --ink2:#5D574C; --ink3:#93897A;
  --line:#E4DBC9; --brass:#8A6A3B; --brass2:#B5924F;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,SimSun,serif;
  --sans:"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
body{background:#191713;display:flex;justify-content:center;padding:40px;font-family:var(--sans)}
.phone{width:390px;height:844px;background:var(--paper);border-radius:38px;position:relative;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 0 9px #2A2723,0 0 0 10px #3A362F;display:flex;flex-direction:column}
.status{height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:11px;color:var(--ink3)}
.status .b{width:14px;height:7px;border:1px solid var(--ink3);border-radius:2px;opacity:.7}
.top{flex:0 0 auto;padding:6px 20px 8px;display:flex;align-items:center;justify-content:space-between;position:relative}
.top h1{font-family:var(--serif);font-size:23px;letter-spacing:6px;font-weight:600}
.top .n{position:absolute;left:0;right:0;text-align:center;font-size:10.5px;color:var(--ink3);
  letter-spacing:1px;pointer-events:none}
.top .acts{display:flex;align-items:center;gap:8px;margin-left:auto}
.music{position:relative;flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);
  background:var(--paper2);display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .25s,border-color .25s}
.music svg{width:14px;height:14px;fill:none;stroke:var(--brass);stroke-width:1.8}
.music.playing{border-color:transparent;background:linear-gradient(145deg,#B5924F,#8A6A3B)}
.music.playing > svg{display:none}
.music .eq{display:none;align-items:flex-end;gap:2px;height:12px}
.music.playing .eq{display:flex}
.music .eq i{width:2px;border-radius:1px;background:#FCF9F2;height:4px;animation:eq 1s ease-in-out infinite}
.music .eq i:nth-child(2){animation-delay:.18s;height:9px}
.music .eq i:nth-child(3){animation-delay:.36s;height:6px}
@keyframes eq{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.music .ring{position:absolute;inset:-3px;border-radius:50%;pointer-events:none;opacity:0;
  background:conic-gradient(var(--brass2) var(--p,0%),transparent 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));transition:opacity .2s}
.music.playing .ring{opacity:1}

/* 五排分类 */
.srch{flex:0 0 auto;margin:0 20px 8px;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;
  background:var(--paper2);border:1px solid var(--line);border-radius:11px}
.srch svg{width:15px;height:15px;stroke:var(--ink3);fill:none;stroke-width:1.8;flex:0 0 auto}
.srch input{flex:1 1 auto;min-width:0;border:0;background:transparent;outline:none;font-size:12px;
  color:var(--ink);font-family:var(--sans);letter-spacing:.4px}
.srch input::placeholder{color:var(--ink3)}
.srch .clr{font-size:11px;color:var(--ink3);padding:4px 2px;cursor:pointer;display:none}
.srch.has .clr{display:block}
.filters{flex:0 0 auto;padding:2px 0 6px;border-bottom:1px solid var(--line);transition:opacity .2s}
.frow{display:flex;align-items:center;gap:9px;padding:4px 0 4px 20px;transition:opacity .2s}
.frow.off{opacity:.34;pointer-events:none}
.fname{flex:0 0 20px;font-family:var(--serif);font-size:11px;color:var(--brass);letter-spacing:1px;opacity:.9}
.strip{display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;cursor:grab;
  padding:2px 18px 2px 0;mask-image:linear-gradient(90deg,#000 95%,transparent 100%);-webkit-mask-image:linear-gradient(90deg,#000 95%,transparent)}
.strip::-webkit-scrollbar{display:none}
.strip.grabbing{cursor:grabbing;scroll-behavior:auto}
.strip.fade-l{mask-image:linear-gradient(90deg,transparent 0,#000 54px,#000 95%,transparent 100%);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 54px,#000 95%,transparent 100%)}
.chip{flex:0 0 auto;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--paper2);
  font-size:11.5px;color:var(--ink2);letter-spacing:.4px;white-space:nowrap;cursor:pointer;transition:all .16s}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--brass);border-color:var(--brass);color:#fff;box-shadow:0 3px 9px rgba(138,106,59,.22)}
.chip .c{font-size:9px;opacity:.7;margin-left:4px}

/* 内容区 */
.sum{flex:0 0 auto;padding:9px 20px 4px;font-size:10.5px;color:var(--ink3);letter-spacing:.6px;display:flex;gap:6px;align-items:baseline}
.sum b{color:var(--brass);font-weight:500}
.sum .r{margin-left:auto;flex:0 0 auto}
.list{flex:1 1 auto;overflow-y:auto;padding:2px 20px 86px}

/* 卷列表 */
.bk{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid rgba(228,219,201,.75);cursor:pointer}
.bk:active{background:#F1E9D9}
.bk .nm{font-family:var(--serif);font-size:14.5px;letter-spacing:.6px}
.bk .meta{font-size:10px;color:var(--ink3);letter-spacing:.4px;margin-top:2px}
.bk .go{margin-left:auto;color:#B9AE9C;font-size:12px}

/* 字卡：一行一张 */
.crow{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid rgba(228,219,201,.75);cursor:pointer}
.crow:active{background:#F1E9D9}
.cc{flex:0 0 46px;height:54px;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:33px;line-height:1;letter-spacing:0;color:var(--ink);
  background:var(--paper2);border:1px solid var(--line);border-radius:9px}
.cm{flex:1 1 auto;min-width:0}
.cn{font-family:Georgia,serif;font-size:9.5px;color:var(--brass);letter-spacing:.6px}
.cb{font-size:10.5px;color:var(--ink3);letter-spacing:.3px;margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr{flex:0 0 auto;font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums}
.cr b{font-size:13px;color:var(--ink2);font-weight:600}
.cs{flex:0 0 auto;font-size:8.5px;color:var(--brass);border:1px solid rgba(138,106,59,.28);
  border-radius:4px;padding:2px 5px;letter-spacing:.5px;background:rgba(138,106,59,.05)}
.empty{padding:46px 16px;text-align:center;color:var(--ink3);font-size:12px;line-height:1.9}

/* 底栏 */
.tabbar{flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:rgba(252,249,242,.96);padding:9px 6px calc(9px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink3);position:relative;padding-top:5px}
.tab svg{width:21px;height:21px}
.tab span{font-size:10.5px;letter-spacing:1.4px}
.tab.on{color:var(--brass)}.tab.on span{font-weight:600}
.tab.on:before{content:"";position:absolute;top:-6px;width:20px;height:2px;border-radius:2px;background:var(--brass)}


/* ── 词卡版式 ── */
.wcc{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.wfront{padding:30px 24px 22px}
.wfront .stats{justify-content:center}
.wfront .words{justify-content:center}
.wword{font-family:var(--serif);font-size:62px;line-height:1.2;letter-spacing:6px;text-align:center;margin-top:2px;
  background:linear-gradient(160deg,#3A342B 10%,#26231E 55%,#4A4030 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.wpy{font-family:Georgia,serif;font-size:12.5px;color:var(--brass);letter-spacing:3px;text-align:center;margin-top:22px}
.wpos{text-align:center;margin-top:7px}
.wpos span{font-size:9.5px;color:var(--ink3);border:1px solid var(--line);border-radius:999px;padding:2px 8px;letter-spacing:1px}
.wback{padding:26px 24px 20px}
.wsen{display:flex;gap:7px;align-items:baseline;font-size:10.5px;color:var(--ink2);line-height:1.75;margin-bottom:3px}
.wsen .k{color:var(--brass);font-family:Georgia,serif;flex:0 0 auto}
.wsen .nm{flex:1 1 auto}
.wsen .rf{flex:0 0 auto;font-size:9px;color:var(--ink3);letter-spacing:.3px}
.wgo{position:sticky;bottom:10px;z-index:6;margin-top:4px;letter-spacing:1px;font-size:12px;color:#fff;background:var(--brass);border:none;
  border-radius:999px;padding:10px 20px;cursor:pointer;box-shadow:0 6px 16px rgba(138,106,59,.25)}
.wgo:active{transform:scale(.97)}

/* 卡片详情 */
.mask{position:absolute;inset:0;background:rgba(30,26,20,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.mask.on{opacity:1;pointer-events:auto}
.detail{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px 0 78px;overflow-y:auto;overscroll-behavior:contain;z-index:10;opacity:0;pointer-events:none;transition:opacity .22s}
.detail.on{opacity:1;pointer-events:auto}
.flip{width:322px;height:400px;perspective:1400px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .62s cubic-bezier(.2,.8,.2,1)}
.flip.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper2);
  border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 18px 40px rgba(40,30,10,.22);display:flex;flex-direction:column}
.face.back{transform:rotateY(180deg)}
.corner{position:absolute;left:22px;top:16px;width:26px;height:2px;background:var(--brass);opacity:.55;border-radius:2px}
.idx{position:absolute;right:20px;top:14px;font-size:9.5px;color:var(--ink3);letter-spacing:2px}
.front{padding:30px 24px 22px}
.charbox{display:flex;align-items:flex-end;gap:14px;margin-top:10px}
.bigc{font-family:var(--serif);font-size:104px;line-height:.92;letter-spacing:2px;
  background:linear-gradient(160deg,#3A342B 10%,#26231E 55%,#4A4030 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.pyr{font-family:Georgia,serif;font-size:13px;color:var(--brass);letter-spacing:1px;padding-bottom:16px}
.stats{display:flex;gap:16px;margin-top:18px;font-size:10px;color:var(--ink3);letter-spacing:.6px}
.stats b{font-size:15px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;margin-right:3px}
.ordnote{margin-top:7px;font-size:9px;color:var(--ink3);letter-spacing:.4px}
.words{margin-top:13px;display:flex;flex-wrap:wrap;gap:7px}
.w{padding:5px 9px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--ink2);background:var(--paper)}
.w b{color:var(--brass);font-weight:500;margin-left:3px;font-size:9.5px}
.vs{margin-top:auto;border-top:1px solid rgba(228,219,201,.8);padding-top:12px}
.face.tight .vs{padding-top:8px}
.face.tight .dist{margin-top:8px}
.face.tight .dhd{margin-bottom:5px}
.face.tight .bvs{padding-top:8px}
.vs .q{font-family:var(--serif);font-size:14px;line-height:1.92;color:var(--ink)}
.vs .r{margin-top:7px;font-size:9.5px;color:var(--brass);letter-spacing:1.5px}
.back{padding:28px 24px 22px}
.bh{display:flex;align-items:baseline;gap:10px}
.bh .c{font-family:var(--serif);font-size:22px;letter-spacing:2px}
.bh .p{font-size:9.5px;color:var(--ink3);letter-spacing:1.4px}
.def{margin-top:14px;font-size:11.5px;line-height:2.05;color:var(--ink2);text-align:justify}
.def b{color:var(--ink)}
.dist{margin-top:12px}
.dhd{font-size:9px;color:var(--ink3);letter-spacing:.6px;margin-bottom:6px}
.drow{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.dl{flex:0 0 64px;font-size:9.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt{flex:1 1 auto;height:5px;background:#EEE7D8;border-radius:3px;overflow:hidden}
.dt i{display:block;height:100%;background:var(--brass2);border-radius:3px}
.dn{flex:0 0 32px;text-align:right;font-size:9.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.drest{margin-top:1px;font-size:9px;color:var(--ink3);letter-spacing:.3px}
.bvs{margin-top:auto;border-top:1px solid rgba(228,219,201,.8);padding-top:12px}
.bvs .q{font-family:var(--serif);font-size:13.6px;line-height:1.9}
.bvs .r{margin-top:7px;font-size:9.5px;color:var(--brass);letter-spacing:1.5px}

.lkrow{display:inline-flex;flex-wrap:wrap;align-items:center;gap:7px;justify-content:center;
  margin:14px auto 0;padding:7px 13px;background:var(--paper2);border:1px solid var(--line);
  border-radius:999px;box-shadow:0 6px 18px rgba(38,35,30,.13)}
.lkw{font-size:10px;letter-spacing:2px;color:var(--brass)}
.lkchip{background:var(--paper);border:1px solid rgba(181,146,79,.45);border-radius:999px;
  padding:4px 11px;font-size:11px;color:var(--ink);letter-spacing:.4px;cursor:pointer;white-space:nowrap}
.lkchip:active{background:rgba(181,146,79,.22)}
#detail .lkrow{position:relative;z-index:3}
.dhint{font-size:10px;color:#D8CBB4;letter-spacing:2px}
.close{position:absolute;right:22px;top:64px;width:30px;height:30px;border-radius:50%;background:rgba(252,249,242,.16);
  color:#F3EADA;display:flex;align-items:center;justify-content:center;font-size:15px;z-index:11;cursor:pointer}
.toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,10px);background:rgba(38,35,30,.92);color:#F6F2E8;
  font-size:11.5px;letter-spacing:1px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:all .25s;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}


/* ═══ 节卡（当前 1 张：约翰福音 3:16）═══ */
.vfront{padding:22px 24px 18px}
.vtext{flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--serif);
  line-height:1.92;color:var(--ink);letter-spacing:.4px;text-align:justify;padding:6px 2px}
.vref{text-align:center}
.vref .r1{font-family:var(--serif);font-size:13px;letter-spacing:2px;color:var(--ink)}
.vref .r2{font-size:9.5px;color:var(--ink3);letter-spacing:1px;margin-top:5px}
.vback{padding:20px 24px 18px}
.vbh{display:flex;align-items:baseline;gap:8px;font-size:9.5px;color:var(--ink3);letter-spacing:1.6px}
.vbh b{font-family:var(--serif);font-size:15px;color:var(--ink);letter-spacing:1px;font-weight:400}
.vbh .n{margin-left:auto;font-size:8.5px;color:var(--brass)}
.vtrack{margin:11px 0 2px}
.vbar{position:relative;height:5px;border-radius:3px;background:#E7DFCE}
.vbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:rgba(138,106,59,.28)}
.vbar b{position:absolute;top:-3.5px;width:2px;height:12px;background:var(--brass);border-radius:1px;
  transform:translateX(-1px);box-shadow:0 0 0 1.5px rgba(138,106,59,.14)}
.vtl{display:flex;justify-content:space-between;font-size:9px;color:var(--ink3);letter-spacing:.6px;margin-top:6px}
.vtl span:nth-child(2){color:var(--brass);letter-spacing:1px}
.vctx{margin-top:8px;padding-top:7px;border-top:1px dashed rgba(228,219,201,.95)}
.vctx .k{font-size:8.5px;color:var(--brass);letter-spacing:1.5px;margin-bottom:3px}
.vctx .t{font-family:var(--serif);font-size:10.5px;line-height:1.62;color:var(--ink2);
  display:block;overflow:visible;white-space:normal}
.face.back{overflow-y:auto}                 /* 经文完整显示后若超高，可滚动 */
.vlks{margin-top:14px;padding-top:8px;border-top:1px dashed rgba(228,219,201,.95)}
.vlks .h{font-size:8.5px;color:var(--brass);letter-spacing:1.5px;margin-bottom:5px}
.vlk{display:flex;align-items:baseline;gap:6px;padding:1.5px 0;font-size:10.5px;line-height:1.32;color:var(--ink)}
.vlk .w{font-family:var(--serif);font-size:12px;letter-spacing:1px}
.vlk .n{font-size:8.5px;color:var(--ink3)}
.vlk .tag{margin-left:auto;font-size:8.5px;color:var(--brass);border:1px solid var(--line);
  border-radius:999px;padding:1px 6px;letter-spacing:.6px}
.vlk.off{opacity:.55} .vlk.off .tag{color:var(--ink3)}
.vbfoot{margin-top:auto;display:flex;justify-content:space-between;font-size:8.5px;color:var(--ink3);
  letter-spacing:.8px;padding-top:7px}
.vcell{width:46px;height:54px;flex:0 0 46px;border-radius:9px;border:1px solid var(--line);background:var(--paper2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.vcell b{font-family:var(--serif);font-size:16px;color:var(--ink);font-weight:400;letter-spacing:.5px}
.vcell span{font-size:9px;color:var(--brass);letter-spacing:.3px;margin-top:2px;font-variant-numeric:tabular-nums}

/* ═══ 章卡（当前 1 张：约翰福音 第 3 章）═══ */
.chfront{padding:18px 21px}
.chhead{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;margin-top:22px}
.chbk{font-family:var(--serif);font-size:23px;letter-spacing:6px;color:var(--ink)}
.chcn{display:flex;align-items:baseline;gap:5px;margin-top:2px}
.chnum{font-family:var(--serif);font-size:54px;line-height:1.08;
  background:linear-gradient(160deg,#3A342B 10%,#26231E 55%,#4A4030 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.chunit{font-family:var(--serif);font-size:16px;color:var(--brass);letter-spacing:2px}
.chpos{font-size:9.5px;color:var(--ink3);letter-spacing:1.2px;margin-top:3px}
.chvwrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:6px 0}
.chvs{padding-top:8px;border-top:1px dashed rgba(228,219,201,.95);width:100%}
.chvs .k{font-size:8.5px;color:var(--brass);letter-spacing:1.5px;margin-bottom:3px}
.chvs .t{font-family:var(--serif);font-size:11.5px;line-height:1.75;color:var(--ink)}
.chstat{text-align:center;font-size:9.5px;color:var(--ink3);letter-spacing:1px;margin-top:auto}
.chback{padding:18px 21px}
.chrow{display:flex;align-items:baseline;gap:7px;font-size:9px;color:var(--ink3);letter-spacing:1.1px;white-space:nowrap}
.chrow b{font-family:var(--serif);font-size:14px;color:var(--ink);letter-spacing:1px;font-weight:400}
.chrow .n{margin-left:auto;font-size:8.5px;color:var(--brass)}
.chmain{margin-top:6px;font-size:11.5px;color:var(--ink2)}
.chmain b{font-family:var(--serif);font-size:13px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.chmeta{margin-top:2px;font-size:8.8px;color:var(--ink3)}
.chkvh{margin-top:7px;padding-top:5px;border-top:1px dashed rgba(228,219,201,.95);
  font-size:8.5px;color:var(--brass);letter-spacing:1.4px}
.chkv{padding:3px 0;border-bottom:1px solid rgba(228,219,201,.45)}
.chkv .r{display:block;font-size:8.4px;color:var(--brass);letter-spacing:.7px;margin-bottom:1px}
.chkv .t{display:block;font-family:var(--serif);font-size:10.8px;line-height:1.62;color:var(--ink);text-align:justify}
.face.chTight .chkvh{margin-top:4px;padding-top:3px}
.face.chTight .chkv{padding:1.5px 0}
.face.chTight .chkw{margin-top:4px}
.chkw{margin-top:7px;font-size:9px;color:var(--ink3);letter-spacing:.3px}
.chkw .h{font-size:8.4px;color:var(--brass);letter-spacing:1.3px;margin-right:5px}
.chkw span{margin-right:8px}
.chkw b{color:var(--ink2);font-weight:600;font-size:9.3px;margin-left:2px}

let IDX = null, CARDS = [], WORDS = [], VERSES = [], CHAPTERS = [];

let REST_LOADING = null;

      WORDS = got[0]; CHAPTERS = got[2];

function bookOfChapter(b){ return BOOKS[b]; }
function buildVMAP(){
  /* 节卡：全量 31,104 张不在 index 里（锚点=自身坐标），直接从 verses 汇总 */
  VMAP.z = {book:{}, genre:{}, test:{}};
  VMAP.v = {book:{}, genre:{}, test:{}};
  VERSES.forEach(function(e){
    const B = bookOfChapter(e.b); if(!B) return;
    VMAP.v.book[B.n] = (VMAP.v.book[B.n]||0) + 1;
    VMAP.v.genre[B.g] = (VMAP.v.genre[B.g]||0) + 1;
    VMAP.v.test[B.t]  = (VMAP.v.test[B.t]||0) + 1;
  });
  /* 字卡锚点是「卷→次数」，没有章节清单，单独汇总 */
  const byName = {};
  BOOKS.forEach(function(B){ byName[B.n] = B; });
  CARDS.forEach(function(cd){
    const bs = (cd.books || {}), seenG = {}, seenT = {};
    Object.keys(bs).forEach(function(nm){
      const B = byName[nm]; if(!B) return;
      VMAP.z.book[B.n] = (VMAP.z.book[B.n]||0) + 1;
      if(!seenG[B.g]){ seenG[B.g] = 1; VMAP.z.genre[B.g] = (VMAP.z.genre[B.g]||0) + 1; }
      if(!seenT[B.t]){ seenT[B.t] = 1; VMAP.z.test[B.t]  = (VMAP.z.test[B.t]||0) + 1; }
    });
  });
  VMAP.w = {book:{}, genre:{}, test:{}};
  WORDS.forEach(function(w0){
    const bs = (w0.books || {}), sg = {}, st = {};
    Object.keys(bs).forEach(function(nm){
      const B = byName[nm]; if(!B) return;
      VMAP.w.book[B.n] = (VMAP.w.book[B.n]||0) + 1;
      if(!sg[B.g]){ sg[B.g]=1; VMAP.w.genre[B.g] = (VMAP.w.genre[B.g]||0)+1; }
      if(!st[B.t]){ st[B.t]=1; VMAP.w.test[B.t]  = (VMAP.w.test[B.t]||0)+1; }
    });
  });
  ['cp'].forEach(function(t){
    VMAP[t] = {book:{}, genre:{}, test:{}};
    const g = (IDX && IDX[t]) || {};
    Object.keys(g).forEach(function(id){
      /* 一张卡在每个维度只计一次：该卡在这一卷/这一书类/这一约里出现过，就 +1 */
      const seenB = {}, seenG = {}, seenT = {};
      (g[id].chapters || []).forEach(function(pair){

      });
    });
  });
}

  if (total <= SHOWN) return;

  if (!el) return;
  if (_io) { _io.disconnect(); _io = null; }

}

const qEl = document.getElementById('q');
function tone(x){ return (x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function hitCard(c, kw){
  const raw = kw.trim(); if(!raw) return true;
  const k = tone(raw);
  return c.ch === raw
      || tone(c.py).indexOf(k) >= 0
      || String(c.no) === k || String(c.no).padStart(4,'0') === k
      || (c.words||[]).some(w=>w[0].indexOf(raw) >= 0)
      || (c.bk||'').indexOf(raw) >= 0;
}

const isCardView = ()=> S.card === "字卡";
function genresAvailable(){ return F.genre.filter(g=>!S.test || GENRE_OF_TEST[g]===S.test); }
function booksMatched(){
  return BOOKS.filter(b=>(!S.test||b.t===S.test)&&(!S.genre||b.g===S.genre)&&(S.bookIdx===null||b.i===S.bookIdx));
}
function bookOf(c){ return BOOKS.find(b=>b.n===c.bk); }        // 出现最多的那一卷（仅用于展示）
function cardVols(c){ return Object.keys(c.books).length; }
function inBook(c,name){ return (c.books[name]||0) > 0; }
function inTest(c,t){ return Object.keys(c.books).some(n=>{const b=BOOKS.find(x=>x.n===n); return b&&b.t===t;}); }
function inGenre(c,g){ return Object.keys(c.books).some(n=>{const b=BOOKS.find(x=>x.n===n); return b&&b.g===g;}); }
function wInBook(w, name){ return (w.books[name]||0) > 0; }
function wInTest(w, t){ return Object.keys(w.books).some(n=>{const b=BOOKS.find(x=>x.n===n); return b && b.t===t;}); }
function wInGenre(w, g){ return Object.keys(w.books).some(n=>{const b=BOOKS.find(x=>x.n===n); return b && b.g===g;}); }
function wordBooks(){                       // 词卡实际出现过的卷（只列有经文的）
  const set=new Set();
  WORDS.forEach(w=>Object.keys(w.books).forEach(n=>{
    const b=BOOKS.find(x=>x.n===n); if(!b) return;
    if(S.test && b.t!==S.test) return;
    if(S.genre && b.g!==S.genre) return;
    set.add(n);
  }));
  return BOOKS.filter(b=>set.has(b.n)).map(b=>b.n);
}
function wordGenres(){
  const set=new Set();
  WORDS.forEach(w=>Object.keys(w.books).forEach(n=>{const b=BOOKS.find(x=>x.n===n); if(b&&(!S.test||b.t===S.test)) set.add(b.g);}));
  return F.genre.filter(g=>set.has(g));
}
function hitWord(w, kw){
  const raw = (kw||'').trim(); if(!raw) return true;
  const k = tone(raw);
  return w.w.indexOf(raw) >= 0 || w.py.replace(/[^a-zA-Z]/g,'').toLowerCase().indexOf(k) >= 0
      || String(w.no) === k || ('W'+w.no).toLowerCase() === k.toLowerCase();
}
function wordsMatched(){
  return WORDS.filter(w =>
       (!Q || hitWord(w, Q))
    && (!S.state || wordStates(w).indexOf(S.state) >= 0)
    && (!S.test  || wInTest(w, S.test))
    && (!S.genre || wInGenre(w, S.genre))
    && (S.bookIdx===null || wInBook(w, BOOKS[S.bookIdx].n)));
}
function cardsMatched(){
  if(S.card && S.card!=="字卡") return [];        // 词卡/节卡/章卡尚未制作
  return CARDS.filter(c=>
       (!Q || hitCard(c, Q))
    && (!S.state || statesOf(c).indexOf(S.state) >= 0)
    && (!S.test  || inTest(c, S.test))
    && (!S.genre || inGenre(c, S.genre))
    && (S.bookIdx===null || inBook(c, BOOKS[S.bookIdx].n)));
}
function cardGenres(){                       // 字卡实际出现过的书类
  const set=new Set();
  CARDS.forEach(c=>Object.keys(c.books).forEach(n=>{const b=BOOKS.find(x=>x.n===n); if(b&&(!S.test||b.t===S.test)) set.add(b.g);}));
  return F.genre.filter(g=>set.has(g));
}
function cardBooks(){                        // 字卡实际出现过的卷（按正典顺序）
  const set=new Set();
  CARDS.forEach(c=>Object.keys(c.books).forEach(n=>{const b=BOOKS.find(x=>x.n===n);
    if(!b) return;
    if(S.test && b.t!==S.test) return;
    if(S.genre && b.g!==S.genre) return;
    set.add(n);}));
  return BOOKS.filter(b=>set.has(b.n)).map(b=>b.n);
}

}

               + CHAPTERS.filter(x=>chapStates(x).indexOf(v)>=0).length
       : isC  ? CHAPTERS.filter(x=>chapStates(x).indexOf(v)>=0).length
       : isV  ? VERSES.filter(e=>verseStates(e).indexOf(v)>=0).length
       : isW  ? WORDS.filter(w=>wordStates(w).indexOf(v)>=0).length
              : CARDS.filter(c=>statesOf(c).indexOf(v)>=0).length)}))];

    const gs = (isV||isC) ? vg : isW ? wordGenres()

function pick(key,val){
  if(val===null){                                  // 全部：清空该维度
    if(key==='book') S.bookIdx=null; else S[key]=null;
    render(); return;
  }
  if(key==='state') S.state = S.state===val?null:val;
  else if(key==='card') S.card = S.card===val?null:val;
  else if(key==='test'){ S.test=S.test===val?null:val; if(S.test&&S.genre&&GENRE_OF_TEST[S.genre]!==S.test)S.genre=null; S.bookIdx=null; }
  else if(key==='genre'){ if(S.genre===val)S.genre=null; else {S.genre=val;S.test=GENRE_OF_TEST[val];S.bookIdx=null;} }
  else if(key==='book'){                        // 卷最具体：选卷即清空约/书，避免互相锁死
    const b=BOOKS.find(x=>x.n===val);
    if(S.bookIdx===b.i) S.bookIdx=null;
    else { S.bookIdx=b.i; S.test=null; S.genre=null; }
  }
  render();
}

        <div class="vcell"><b>${abbrOf(e.b)}</b><span>${e.c}:${e.v}</span></div>

        <div class="cr">${e.len} 字</div>
        ${versePrimary(e) ? `<div class="cs">${versePrimary(e)}</div>` : ''}</div>`);
    const chapRows = chs.map(x=>`<div class="crow" data-cno="${x.no}">
        <div class="vcell"><b>${x.ab}</b><span>${x.c} 章</span></div>
        <div class="cm"><div class="cn">章卡 №${x.no}</div>
          <div class="cb">${x.book} ${x.c} 章</div></div>
        <div class="cr">${x.n} 节</div>
        ${chapPrimary(x) ? `<div class="cs">${chapPrimary(x)}</div>` : ''}</div>`);
    const allRows = cardRows.concat(wordRows, verseRows, chapRows);
    list.innerHTML = (allRows.length ? allRows.slice(0, SHOWN).join('') : `<div class="empty">这个分类下还没有卡片</div>`) + moreHTML(allRows.length);

    bindMore(cs.length + ws.length + vs.length + chs.length);
    return;
  }
  if(S.card && S.card!=="字卡"){
    sum.innerHTML = `<span>${S.card}</span><span class="r">尚未制作</span>`;
    document.getElementById('hcount').textContent = `${S.card} 0 张`;
    list.innerHTML = `<div class="empty">${S.card}还没做<br>先做完了字卡，再按同一范式往下推</div>`;

  }

  const parts=[]; if(S.card)parts.push(S.card);
  if(S.test)parts.push(S.test); if(S.genre)parts.push(S.genre);
  if(S.bookIdx!==null)parts.push(BOOKS[S.bookIdx].n); if(S.state)parts.push('态 · '+S.state);
  const head = Q ? `搜索「${Q}」` : (parts.length?parts.join(' · '):'全部卡片');
  sum.innerHTML = `<span>${head}</span><span class="r">${ms.length} 张</span>`;

/* ── 卡面自适应：超界依次缩经文/释义字号、行高，最后收紧间距 ── */
function fitFace(face){
  if (!face) return;
  const over = () => face.scrollHeight - face.clientHeight;
  if (over() <= 1) return;
  const q = face.querySelector('.vs .q') || face.querySelector('.bvs .q');
  if (q && over() > 1){
    let fs = parseFloat(getComputedStyle(q).fontSize);
    let lh = parseFloat(getComputedStyle(q).lineHeight) / fs;
    let guard = 0;
    while (over() > 1 && fs > 9.2 && guard++ < 20){
      fs -= 0.3; lh = Math.max(1.52, lh - 0.05);
      q.style.fontSize = fs.toFixed(2) + 'px';
      q.style.lineHeight = lh.toFixed(2);
    }
  }
  if (over() > 1){
    const def = face.querySelector('.def');
    if (def){
      let fs = parseFloat(getComputedStyle(def).fontSize), guard = 0;
      while (over() > 1 && fs > 9.4 && guard++ < 16){
        fs -= 0.25; def.style.fontSize = fs.toFixed(2) + 'px';
      }
    }
  }
  if (over() > 1){
    const kvs = face.querySelectorAll('.chkv');
    if (kvs.length){
      face.classList.add('chTight');
      let fs = parseFloat(getComputedStyle(kvs[0].querySelector('.t') || kvs[0]).fontSize), guard = 0;
      while (over() > 1 && fs > 9.0 && guard++ < 22){
        fs -= 0.2;
        kvs.forEach(e => { const t = e.querySelector('.t'); if (t) t.style.fontSize = fs.toFixed(2) + 'px'; });
      }
    }
  }
  if (over() > 1) face.classList.add('tight');
}

function chapCardOf(b, c){
  if(!IDX) return null;
  return Object.values(IDX.cp).find(x => (x.chapters||[]).some(p => p[0]===b && p[1]===c)) || null;
}
/* 关联卡：优先用 index 里算好的链接；节卡与字/词卡再按章节归属兜底 */
function linksFor(id, vtext){
  const out = [], seen = {};
  const push = (x)=>{ if(x && !seen[x.id]){ seen[x.id]=1; out.push(x); } };
  if(!IDX) return out;
  const t = id.split(':')[0], no = +id.split(':')[1];

  if(t === 'cp' || t === 'z'){
    const e = IDX[t] && IDX[t][id];
    if(e) (e.links||[]).forEach(x => push({ id:x, title:titleOfId(x) }));
    return out;
  }

  if(t === 'w'){                      // 词卡：含该字的字卡 + 首现那一章
    const w = WORDS.find(x => x.no === no);
    if(w){
      (w.w || '').split('').forEach(ch => {
        const z = CARDS.find(c => c.ch === ch);
        if(z) push({ id:'z:'+String(z.no).padStart(4,'0'), title:ch });
      });
      const m = (w.first || '').match(/^(\S+) (\d+):(\d+)$/);
      if(m){
        const bi = BOOKS.findIndex(B => B.n === m[1]);
        if(bi >= 0){ const c = chapCardOf(bi, +m[2]); if(c) push({ id:c.id, title:c.title }); }
      }
    }
    return out;
  }

  if(t === 'v'){                      // 节卡：所在章卡 + 正文里出现的字/词卡
    const v = VERSES.find(x => x.no === no);
    if(v){
      const cp = chapCardOf(v.b, v.c);
      push(cp && { id: cp.id, title: cp.title });
      const T = vtext || '';
      if(T){
        CARDS.forEach(c => { if(T.indexOf(c.ch) >= 0) push({ id:'z:'+String(c.no).padStart(4,'0'), title:c.ch }); });
        WORDS.forEach(w => { if(w.w.length > 1 && T.indexOf(w.w) >= 0) push({ id:'w:'+w.no, title:w.w }); });
      }
    }
  }
  return out;
}

/* 横滑条拖拽 */
function enableDragScroll(strip){
  let s0 = null, moved = false;
  strip.addEventListener('pointerdown', e=>{
    if(e.pointerType === 'touch') return;
    s0 = {x:e.clientX, left:strip.scrollLeft, id:e.pointerId};   // 先不捕获，保证 plain click 能落到 chip
    moved = false;
  });
  strip.addEventListener('pointermove', e=>{
    if(!s0) return;
    const dx = e.clientX - s0.x;
    if(!moved && Math.abs(dx) > 6){          // 真的开始拖了，才捕获指针
      moved = true;
      strip.classList.add('grabbing');
      try{ strip.setPointerCapture(s0.id); }catch(_){}
    }
    if(moved) strip.scrollLeft = s0.left - dx;
  });
  const end = ()=>{
    if(!s0) return;
    s0 = null; strip.classList.remove('grabbing');
    if(moved) setTimeout(()=>{ moved = false; }, 0);   // 让紧随的 click 被下面的捕获器吃掉
  };
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>strip.addEventListener(ev, end));
  strip.addEventListener('click', e=>{
    if(moved){ e.preventDefault(); e.stopPropagation(); moved = false; }
  }, true);
  strip.addEventListener('wheel', e=>{
    if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){ strip.scrollLeft += e.deltaY; e.preventDefault(); }
  }, {passive:false});
}

  if(window.XJ){

  }
  }

<script id="xj-locks">
/* ── 迦南渐锁：只锁未解锁的卡；已解锁正常显示 ── */
(function(){
  const J = window.XJ; if(!J) return;
  const KIND = sel => sel.hasAttribute('data-wno') ? ['w', +sel.dataset.wno]
                    : sel.hasAttribute('data-vno') ? ['v', +sel.dataset.vno]
                    : sel.hasAttribute('data-cno') ? ['cp', +sel.dataset.cno]
                    : sel.hasAttribute('data-no')  ? ['z', +sel.dataset.no]  : null;

  /* 已解锁在前、未解锁在后（两组内部保持原顺序） */
  window.xjUF = function(arr, kind){
    const J = window.XJ; if(!J || !arr || !arr.length) return arr;
    const un = [], lk = [];
    arr.forEach(x => (J.isUnlocked(kind, x.no) ? un : lk).push(x));
    return un.concat(lk);
  };

  function applyLocks(){
    const list = document.getElementById('list'); if(!list) return;
    let total = 0, locked = 0;
    list.querySelectorAll('.crow').forEach(row=>{
      const k = KIND(row); if(!k) return;
      total++;
      const ok = J.isUnlocked(k[0], k[1]);
      if(!ok){ locked++; if(!row.classList.contains('locked')){
        row.classList.add('locked');
        row.innerHTML = `<div class="cc lkcc" style="color:#8A6A3B">` +
          `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">` +
          `<rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8.5 10.5V7.8a3.5 3.5 0 0 1 7 0v2.7"/></svg></div>` +
          `<div class="cm"><div class="cn">未解锁</div>` +
          `<div class="cb">先学完当前进度，这张卡会自动出现</div></div>`;
        row.style.opacity = '.55';
      }} else {
        row.classList.remove('locked');
        row.style.opacity = '';
        const learned = J.isLearned(k[0], k[1]);
        const mark = row.querySelector('.lrb');
        if(learned && !mark){
          const m = document.createElement('div');
          m.className = 'lrb'; m.textContent = '✓';
          row.appendChild(m);
        } else if(!learned && mark) mark.remove();
      }
    });
    // 已解锁置顶，未解锁排在下方（两组内部保持原顺序）
    const rowsArr = [...list.querySelectorAll('.crow')];
    if(rowsArr.length){
      const un = rowsArr.filter(r => !r.classList.contains('locked'));
      const lk = rowsArr.filter(r => r.classList.contains('locked'));
      const ordered = un.concat(lk);
      let changed = false;
      for(let i = 0; i < ordered.length; i++){
        if(rowsArr[i] !== ordered[i]){ changed = true; break; }
      }
      if(changed){
        const sentinel = list.querySelector('#sentinel');
        ordered.forEach(r => list.appendChild(r));
        if(sentinel) list.appendChild(sentinel);
      }
    }

    const h = document.getElementById('hcount');
    if(h && total){
      const first = list.querySelector('.crow');
      const k = first ? KIND(first) : null;
      const NAME = {z:'字卡', w:'词卡', v:'节卡', cp:'章卡'};
      const TOT = {z: CARDS.length, w: WORDS.length, v: VERSES.length, cp: CHAPTERS.length};
      if(k) h.textContent = NAME[k[0]] + ' 已解锁 ' + J.countKind(k[0]) + ' / ' + TOT[k[0]].toLocaleString();
    }
    if(location.search.indexOf('q=') >= 0 && total && locked === total && !window._xjSearched){
      window._xjSearched = true;
      const b = J.book();
      J.toast('该内容尚未解锁 · 当前进度：' + (b ? b.book + ' ' + J.p.cursor.chap + '/' + b.chaps + ' 章' : '创世记 1 章'));
    }
  }

  // 拦截未解锁项的点击
  document.addEventListener('click', function(e){
    const row = e.target.closest && e.target.closest('.crow.locked');
    if(row){ e.preventDefault(); e.stopPropagation(); J.lockToast(); }
  }, true);

  J.init().then(()=>{
    try { J.ensureBook && J.ensureBook(); } catch(e){}
    try { render(); } catch(e){}          /* 学习状态到位后重绘一次（态计数依赖 XJ） */
    /* 节卡 → 所属卷/章（供 P1 分批与章卡解锁使用） */
    try {
      J.setVerseInfo((b0, c, v) => {
        const e = VERSES.find(x => x.b === b0 && x.c === c && x.v === v);
        return e ? { b: e.b + 1, c: e.c, no: e.no, v: e.v } : null;
      });
    } catch(e){}
    applyLocks();
    const list = document.getElementById('list');
    if(list) new MutationObserver(()=>applyLocks()).observe(list, {childList:true});
    setInterval(applyLocks, 1200);
    setTimeout(function(){ try { render(); } catch(e){} }, 1200);
  }).catch(()=>{});
})();
</script>

    XJfx.burst(document.getElementById('flip'), fx);
  }
  if(r.levelUp) J.levelOverlay(r.levelUp);
  if(r.words && r.words.length){
    J.toast('已学习 · 解锁 ' + r.words.length + ' 张词卡');
  }
  else if(kind === 'cp'){
    const vol = await J.afterChapter(no);          // 先判卷，再推进（分卷后不能反序）
    J.nextChapter();
    if(vol && vol.volume){
      J.toast('「' + vol.bookName + '」整卷完成 · +5 抽卡');
      for(const c of (vol.rewards || [])) { await J.figureOverlay(c); await new Promise(r => setTimeout(r, 1600)); }
    } else if(vol){
      J.toast('本章完成 · +2 抽卡 · 已进入第 ' + J.p.cursor.chap + ' 章（' + vol.chapterDone + '/' + vol.chapterTotal + ' 章）');
    }
  }
  else J.toast('已学习');

  /* 词卡学完 → 解锁含该词的节卡 */
  if(kind === 'w'){
    const v = await J.wordUnlockVerse(no);
    if(v){
      const t = (v.b && v.c) ? (' · ' + abbrOf(v.b - 1) + ' ' + v.c) : '';
      J.toast('已学习 · 解锁 1 张节卡' + t);
      if(window.XJfx) XJfx.chime('unlock');
      /* 在按钮下方给一个「去看这张节卡」的直达入口，避免用户找不到 */
      if(!document.getElementById('xjNextStep')){
        const box = document.createElement('div');
        box.id = 'xjNextStep';
        box.style.cssText = 'margin:12px auto 0;text-align:center';
        box.innerHTML = '<a href="经库.html?card=verse&vno=' + v.vno + '" style="display:inline-block;font-size:11.5px;'
          + 'letter-spacing:1px;color:#8A6A3B;border-bottom:1px solid #8A6A3B;padding-bottom:2px;text-decoration:none">'
          + '已解锁节卡' + (v.c ? ' · ' + abbrOf(v.b - 1) + ' ' + v.c + ':' + (v.v || '') : '') + ' · 去看 ›</a>';
        const btn = b.parentElement === detail ? b : b;
        (btn.parentElement || detail).appendChild(box);
      }
    }
  }
  /* 节卡学完 → 本批课学完则解锁本章章卡 */
  if(kind === 'v'){
    const cv = window.__curVerse || {};
    const a = await J.afterVerse(no, cv.b0, cv.c, cv.v);
    if(a && a.fresh){ J.toast('本批节卡学完 · 解锁本章章卡'); if(window.XJfx) XJfx.chime('chapter'); }
    else if(a && a.pending) J.toast('本批还剩 ' + a.pending + ' 张节卡');
  }
}, true);
</script>
</body>
</html>
